spring:
  application:
    name: fishhub-search # 应用名称
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  cloud:
    nacos:
      config:
        server-addr: http://${NACOS_ADDR:127.0.0.1:8848}
        prefix: ${spring.application.name}
        group: DEFAULT_GROUP
        namespace: fishhub
        file-extension: yaml
        refresh-enabled: true
      discovery:
        enabled: true
        group: DEFAULT_GROUP
        namespace: fishhub
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}