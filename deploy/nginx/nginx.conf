worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json image/svg+xml;
    gzip_vary on;

    # 允许客户端最大上传大小（适配多图/视频上传与 MinIO 预签名直传）
    client_max_body_size 100M;
    client_body_buffer_size 10M;

    # 后端微服务网关集群（默认指向 Gateway 8000 端口）
    upstream fishhub_gateway {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost; # 部署时替换为实际域名或公网 IP

        # 安全响应头（前端静态资源由 Nginx 直接托管，CSP 在此下发）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # 说明：Vue 模板编译产物无内联脚本；style-src 保留 unsafe-inline 以兼容组件内联样式
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # -------------------------------------------------------------
        # 1. 前端 Vue3 静态资源托管
        # -------------------------------------------------------------
        location / {
            root   /usr/share/nginx/html/fishhub-vue3/dist; # 前端 npm run build 生成的 dist 目录
            index  index.html index.htm;
            # 支持 Vue Router HTML5 History 路由模式，避免页面刷新 404
            try_files $uri $uri/ /index.html;
        }

        # 静态资源强缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html/fishhub-vue3/dist;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # -------------------------------------------------------------
        # 2. 后端 API 反向代理到 Spring Cloud Gateway (Sentinel)
        # -------------------------------------------------------------
        location /api/ {
            # 转发至网关，末尾斜杠会自动剔除 location 匹配的 /api/ 前缀
            proxy_pass http://fishhub_gateway/;

            # HTTP/1.1 长连接
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 核心透传请求头：传递真实客户端 IP，供 Gateway、Sentinel 与下游限流服务使用
            # 注意：X-Real-IP / X-Forwarded-For 一律用 $remote_addr 覆写（$proxy_add_x_forwarded_for 会拼接
            # 客户端伪造的前缀值，导致网关信任了伪造 IP），网关侧仅当对端命中 TRUSTED_PROXY_IPS 才采信
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时与缓冲设置
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 64k;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
