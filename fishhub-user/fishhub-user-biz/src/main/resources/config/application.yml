server:
  port: 8001 # 项目启动的端口

spring:
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  threads:
    virtual:
      enabled: true # 开启 JDK 21 虚拟线程支持（Tomcat 与 Async 线程池）
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

mybatis:
  # MyBatis xml 配置文件路径
  mapper-locations: classpath:/mapper/**/*.xml

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: random-128
  is-log: false
